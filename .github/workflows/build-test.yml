name: Lint & Test

# Fast PR feedback: fmt, clippy, and native tests in one job (one cache
# restore, one rustc link of the workspace).  mold speeds up linking
# large test binaries vs. the default GNU ld.
#
# No anchor build, no BPF dispatch, no Docker image.
#
# Packages that CPI into Metaplex Core (ario-arns, ario-ant,
# ario-ant-escrow) are NOT tested here: native solana-program-test
# needs mpl_core.so under BPF_OUT_DIR (see CLAUDE.md). For those, run
# `scripts/test-integration.sh` locally (handles all setup correctly)
# or trigger the `bpf-integration` workflow manually for a CI run.
#
# Release pipelines call this workflow as a gate only; full on-chain
# validation remains the deploy / manual test path.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_call' &&
       format('lint-test-call-{0}', github.sha) ||
       format('lint-test-pr-{0}',
         github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  workflow_call:

env:
  # Host toolchain: used for fmt, clippy, cargo test.
  # Must match the channel in rust-toolchain.toml so local and CI
  # lints stay identical.
  RUST_TOOLCHAIN_HOST: 1.90.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  lint-and-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Anchor derives error codes positionally (6000 + variant index), so a
      # mid-enum insertion silently renumbers every later code and breaks every
      # off-chain consumer matching on the old numbers (ADR-035). This reads the
      # Rust source directly, so it needs no Anchor/Solana toolchain and keeps
      # this job's "no anchor build" property. Runs first: it is ~instant, and
      # an ABI break should not wait behind a clippy cycle.
      - name: Error-code ABI stability check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request, also require the COMMITTED snapshot to EXTEND
          # the target branch's rather than rewrite it. Without that, a PR
          # could regenerate or truncate error-code-snapshots.json and launder
          # a renumbering straight past this check -- the snapshot is the
          # guard, so its own integrity has to be checked too.
          # workflow_dispatch / workflow_call have no base SHA: plain check.
          BASELINE=""
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
            if git show "$BASE_SHA:error-code-snapshots.json" \
                 > /tmp/base-snapshot.json 2>/dev/null; then
              BASELINE="--baseline /tmp/base-snapshot.json"
            else
              echo "note: target branch has no error-code-snapshots.json yet" \
                   "(first landing) -- skipping the baseline comparison"
            fi
          fi
          node scripts/error-code-snapshot.mjs $BASELINE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_HOST }}
          components: rustfmt, clippy

      - name: Install mold + clang (faster links)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ar-io-contracts-lint-test

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: Test (native dispatch — core, gar, test-utils)
        run: >-
          cargo test -p ario-core -p ario-gar -p ario-test-utils
          --no-fail-fast

      # Schema-migration regression tests (ADR-020) are native (no Metaplex
      # CPI / no BPF), so they run on the host job even though arns/ant
      # integration suites need the BPF toolchain. These guard against the
      # grow-then-deserialize bomb being reintroduced — they build GENUINE
      # pre-version accounts, unlike the full-size version={0,0,0} fixtures.
      # (core's schema_migration test already runs via `-p ario-core` above.)
      - name: Test (schema-migration regressions — arns, ant)
        run: >-
          cargo test -p ario-arns -p ario-ant --test schema_migration
          --no-fail-fast
